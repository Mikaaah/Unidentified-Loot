plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = '1.0.1-tnk-neoforge-1.21.1'
group = 'dev.mikaaah.tnkloot'
base { archivesName = 'tnkloot' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    runs {
        client { client(); jvmArgument '-Xmx3G' }
        server { server(); jvmArgument '-Xmx3G'; programArgument '--nogui' }
    }
    mods {
        tnkloot { sourceSet(sourceSets.main) }
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

repositories {
    maven { url = uri('build-deps/maven') }
    maven { url = 'https://maven.neoforged.net/releases' }
    mavenCentral()
    maven { url = 'https://maven.shadowsoffire.dev/releases' }
    maven { url = 'https://api.modrinth.com/maven' }
}
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    implementation files('build-deps/apotheosis.jar','build-deps/placebo.jar','build-deps/apothic_attributes.jar','build-deps/patchouli.jar')
    runtimeOnly files('build-deps/curios.jar')
}
tasks.named('test', Test) { useJUnitPlatform() }
java { withSourcesJar() }
tasks.named('processResources') {
    inputs.property('version', project.version)
    filesMatching('META-INF/neoforge.mods.toml') { expand(version: project.version) }
}

neoForge.unitTest {
    enable()
    testedMod = neoForge.mods.tnkloot
}

dependencies { testRuntimeOnly 'org.junit.platform:junit-platform-launcher' }

// Forward console commands during the development server run.
tasks.named('runServer', JavaExec) { standardInput = System.in }

// Required TNK companion supplied by the pack or the beta CI bootstrap build.
if (providers.gradleProperty('tnkProgressionJar').isPresent()) {
    dependencies { runtimeOnly files(providers.gradleProperty('tnkProgressionJar').get()) }
}

dependencies { compileOnly files('build-deps/create-1.21.1-6.0.10.jar', 'build-deps/ponder-1.0.82.jar') }
if (providers.gradleProperty('createRuntimeJar').isPresent()) {
    dependencies { runtimeOnly files(providers.gradleProperty('createRuntimeJar').get()) }
}
if (providers.gradleProperty('extraRuntimeDirectory').isPresent()) {
    dependencies { runtimeOnly fileTree(providers.gradleProperty('extraRuntimeDirectory').get()) { include '*.jar' } }
}

if (providers.gradleProperty('clientVisualCheck').isPresent()) {
    sourceSets.main.java.srcDir('verification/client')
    neoForge.runs.client {
        programArgument '--quickPlaySingleplayer'
        programArgument 'TNKLootVisual'
        programArgument '--width'
        programArgument '1280'
        programArgument '--height'
        programArgument '900'
    }
}

// Keep optional API jars out of the mod; fetch the pinned unmodified build inputs.
tasks.register('preparePonder', Exec) {
    commandLine 'python3', 'tools/prepare_ponder.py'
    outputs.files('build-deps/create-1.21.1-6.0.10.jar', 'build-deps/ponder-1.0.82.jar')
}
tasks.named('compileJava') { dependsOn tasks.named('preparePonder') }
tasks.register('writeVerificationClasspath') {
    dependsOn tasks.named('classes')
    doLast { file('build/verification-classpath.txt').text = sourceSets.main.compileClasspath.asPath }
}

tasks.named('jar') { exclude 'dev/mikaaah/tnkloot/client/ClientVisualCheck.class' }

if (providers.gradleProperty('ponderRegressionTests').isPresent()) {
    sourceSets.test.java.srcDir('verification/ponder')
    dependencies { testImplementation files('build-deps/create-1.21.1-6.0.10.jar', 'build-deps/ponder-1.0.82.jar') }
}
if (providers.gradleProperty('ponderVisualCheck').isPresent()) {
    sourceSets.main.java.srcDir('verification/ponderclient')
    neoForge.runs.client {
        programArgument '--quickPlaySingleplayer'
        programArgument 'TNKPonderVisual'
        programArgument '--width'
        programArgument '1280'
        programArgument '--height'
        programArgument '900'
    }
}
tasks.named('jar') { exclude 'dev/mikaaah/tnkloot/client/ponder/PonderClientCheck*.class' }

if (providers.gradleProperty('tnkReleaseSmoke').isPresent()) {
    neoForge.runs.server {
        systemProperty 'tnkloot.releaseSmokeTest', 'true'
        systemProperty 'tnkloot.exportAudit', 'true'
    }
}
if (providers.gradleProperty('tnkAdvancementSmoke').isPresent()) {
    neoForge.runs.server { systemProperty 'tnkloot.advancementRewardSmokeTest', 'true' }
}
if (providers.gradleProperty('tnkBetaSmoke').isPresent()) {
    neoForge.runs.server { systemProperty 'tnkloot.betaSmokeTest', 'true' }
}
if (providers.gradleProperty('tnkMachineSmoke').isPresent()) {
    neoForge.runs.server { systemProperty 'tnkloot.machineSmokeTest', 'true' }
}

tasks.named('processResources') {
    from('third-party-licenses') { into 'META-INF/licenses' }
    from('THIRD_PARTY_NOTICES.md')
}


tasks.register('prepareBuildDependencies', Exec) {
    commandLine 'python3', 'tools/prepare_build_dependencies.py'
    outputs.files('build-deps/apotheosis.jar', 'build-deps/placebo.jar', 'build-deps/apothic_attributes.jar', 'build-deps/patchouli.jar', 'build-deps/curios.jar')
}
tasks.named('compileJava') { dependsOn 'prepareBuildDependencies' }
