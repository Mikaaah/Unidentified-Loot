name: Build TNK NeoForge release
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Fetch actual supported progression companion
        run: python3 tools/prepare_progression.py
      - name: Build and unit tests
        run: ./gradlew build --stacktrace -PtnkProgressionJar="$PWD/build-deps/tnkprogression-1.2.0-private.1.jar"
      - name: Dedicated server regression checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run verification-logs
          printf 'eula=true\n' > run/eula.txt
          for check in 'tnkReleaseSmoke:TNKLOOT_RELEASE_OK' 'tnkBetaSmoke:TNKLOOT_BETA_OK' 'tnkAdvancementSmoke:TNKLOOT_ADVANCEMENT_REWARDS_OK'; do
            flag="${check%%:*}"
            marker="${check#*:}"
            timeout 300 ./gradlew runServer --stacktrace -P"$flag" -PtnkProgressionJar="$PWD/build-deps/tnkprogression-1.2.0-private.1.jar" 2>&1 | tee "verification-logs/$flag.log"
            grep -q "$marker" "verification-logs/$flag.log"
          done
      - name: Verify unified Apotheosis integration
        run: grep -q TNKLOOT_UNIFIED_APOTHEOSIS_OK verification-logs/tnkReleaseSmoke.log
      - name: Verify release assets and packaging
        run: python3 verification/verify_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TNK-Loot-1.0.1-neoforge-1.21.1
          path: |
            build/libs/*.jar
            build/reports/tests/
            verification-logs/
            run/logs/latest.log
